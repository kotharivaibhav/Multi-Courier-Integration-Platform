services:
  mysql:
    image: mysql:8.0
    container_name: mcip-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multi_courier
      MYSQL_USER: mcip
      MYSQL_PASSWORD: mcip_pass
    ports:
      - '3306:3306'
    volumes:
      - mcip_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: mcip-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - mcip_redis_data:/data

volumes:
  mcip_mysql_data:
  mcip_redis_data:
